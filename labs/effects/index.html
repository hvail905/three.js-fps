<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effects & Post-Processing Lab</title>
<style>
  :root { --panel:#1e2125; --line:#2e3238; --text:#e6e6e6; --dim:#9aa0a6; --acc:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--text); font:13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display:flex; height:100%; }
  main { flex:1; position:relative; min-width:0; }
  aside { width:310px; flex:none; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:10px 12px 24px; }
  canvas { display:block; width:100%; height:100%; }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:0 0 8px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:12px 0 4px; }
  .row { display:grid; grid-template-columns:104px 1fr 42px; gap:6px; align-items:center; margin:3px 0; }
  .row label { color:var(--dim); font-size:12px; }
  .row input[type=range] { width:100%; accent-color:var(--acc); } .row .val { font:12px ui-monospace, Menlo, monospace; text-align:right; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
  button, select { background:#2a2e34; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 7px; font:inherit; cursor:pointer; }
  button.on { background:var(--acc); color:#111; font-weight:600; }
  #stat { position:absolute; left:10px; top:10px; background:rgba(15,17,20,.8); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:12px ui-monospace, Menlo, monospace; color:var(--dim); pointer-events:none; }
  #help { position:absolute; left:10px; bottom:10px; background:rgba(15,17,20,.8); border:1px solid var(--line); border-radius:6px; padding:5px 8px; color:var(--dim); font-size:12px; pointer-events:none; }
  @media (max-width: 760px) { #app { flex-direction:column; } aside { width:100%; height:45vh; border-left:none; } main { height:55vh; flex:none; } }
</style>
</head>
<body>
<div id="app">
  <main><div id="stat"></div><div id="help">Drag to orbit · scroll to zoom · click a surface to spawn a bullet impact there</div></main>
  <aside>
    <h1>Effects & post</h1>
    <div class="row"><label>Look preset</label><select id="preset" style="grid-column:2 / span 2"></select></div>
    <div id="params"></div>
    <h2>Trigger effects</h2>
    <div class="grid" id="fxBtns"></div>
    <h2>Continuous effects</h2>
    <div class="grid" id="fxToggles"></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><button id="bCopy">Copy settings</button><button id="bReset">Reset look</button></div>
  </aside>
</div>
<script type="module">
import { createPropLibrary } from '../../src/assets/props.js';
import { createVehicleLibrary } from '../../src/assets/vehicles.js';
import { createFacadeLibrary } from '../../src/assets/facades.js';
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ParticleSystem, EFFECTS } from '../../src/fx/particles.js';
import { createLook, LOOK_DEFAULT, BLOOM_TRIM_MAX } from '../../src/render/look.js';

const $ = id => document.getElementById(id);
const D2R = THREE.MathUtils.degToRad;

// ---------- look settings ----------
const DEFAULT = LOOK_DEFAULT;
// Your saved looks live in data/looks/*.json; built-in examples follow.
const LOOK_FILES = import.meta.glob('../../data/looks/*.json', { eager: true, import: 'default' });
const PRESETS = {
  ...Object.fromEntries(Object.values(LOOK_FILES).map(f => [f.name + ' (yours)', f.look])),
  'Clean day': {},
  'Golden hour': { sunElevation: 6, sunAzimuth: 250, exposure: 1.1, fogDensity: 0.008, bloomStrength: 0.5, contrast: 1.1, saturation: 1.15, temperature: 0.35, vignette: 0.3 },
  'Gritty night': { sunElevation: -12, exposure: 1.35, fogDensity: 0.012, bloomStrength: 0.9, bloomThreshold: 0.6, contrast: 1.15, saturation: 0.8, temperature: -0.25, tint: 0.05, vignette: 0.45, grain: 0.07, chromatic: 0.0025 },
  'Smog': { sunElevation: 22, fogDensity: 0.03, bloomStrength: 0.25, contrast: 0.92, saturation: 0.65, temperature: 0.2, tint: 0.08, vignette: 0.3, grain: 0.04 },
  'Rainy dusk': { sunElevation: 2, sunAzimuth: 150, exposure: 1.05, fogDensity: 0.018, bloomStrength: 0.7, bloomThreshold: 0.7, contrast: 1.05, saturation: 0.75, temperature: -0.3, vignette: 0.35, grain: 0.05, rain: true },

};
const SPEC = [
  ['Time & atmosphere', [['autoAtmosphere', 'bool'], ['sunElevation', -20, 80, 1, '°'], ['sunAzimuth', 0, 360, 1, '°'], ['exposureTrim', -0.5, 0.5, 0.01, '', 'auto'], ['bloomTrim', 0, BLOOM_TRIM_MAX, 0.01, '×', 'auto'], ['fogTrim', 0, 4, 0.05, '×', 'auto'], ['fogDensity', 0, 0.05, 0.001, '', 'manual']]],
  ['Bloom', [['bloomStrength', 0, 2, 0.01, '', 'manual'], ['bloomRadius', 0, 1, 0.01], ['bloomThreshold', 0, 1, 0.01, '', 'manual']]],
  ['Color grade', [['exposure', 0.3, 2.5, 0.01, '', 'manual'], ['contrast', 0.6, 1.6, 0.01], ['saturation', 0, 2, 0.01], ['temperature', -1, 1, 0.01], ['tint', -1, 1, 0.01]]],
  ['Lens & camera', [['lens', ['none', 'bodycam', 'crt', 'vhs', 'nightvision', 'thermal', 'pixel', 'cinematic']], ['lensAmount', 0, 1, 0.01], ['dof', 'bool'], ['focus', 2, 60, 0.5, 'm'], ['aperture', 0.05, 2, 0.05]]],
  ['Lens', [['vignette', 0, 1, 0.01], ['grain', 0, 0.2, 0.005], ['chromatic', 0, 0.01, 0.0005]]],
  ['Particles', [['particleScale', 0.3, 2, 0.05, 'size ×']]],
];
let L = { ...DEFAULT };
try { Object.assign(L, JSON.parse(localStorage.getItem('vfxlab.v2') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('vfxlab.v2', JSON.stringify(L)); } catch (e) {} };

// ---------- renderer & scene ----------
const main = document.querySelector('main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.info.autoReset = false;
main.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
camera.position.set(14, 6, 18);
const orbit = new OrbitControls(camera, renderer.domElement); orbit.target.set(0, 3, -2); orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI * 0.49;

// sky, sun, fog and the post chain are shared with the game: src/render/look.js
const look = createLook(renderer, scene, camera, { shadowExtent: 30, overlayParent: main });
const { sky, sun, hemi, bloom, grade, bokeh, lens } = look;

// street from the kits
const KP = createPropLibrary(THREE), KV = createVehicleLibrary(THREE), KF = createFacadeLibrary(THREE);
const street = new THREE.Group(); scene.add(street);
const road = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x3d4045, roughness: 0.85 })); road.rotation.x = -Math.PI / 2; road.receiveShadow = true; street.add(road);
const walk = new THREE.Mesh(new THREE.BoxGeometry(60, 0.15, 4), new THREE.MeshStandardMaterial({ color: 0xa8a49c, roughness: 0.95 })); walk.position.set(0, 0.075, -4); walk.receiveShadow = true; street.add(walk);
const place = (obj, x, y, z, ry = 0) => { obj.position.set(x, y, z); obj.rotation.y = ry; street.add(obj); return obj; };
let fx = -18;
for (const f of ['brownstone', 'tenement', 'cornerShop', 'tenement']) { const o = KF.build({ prop: f, params: f === 'tenement' && fx > 0 ? { wallColor: '#6e5a48', signText: 'PAWN', awningColor: '#1f4f8a' } : {} }); o.updateMatrixWorld(true); const w = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()).x; place(o, fx + w / 2, 0.15, -6); fx += w; }
const lamps = [];
for (const x of [-14, 0, 14]) lamps.push(place(KP.build({ prop: 'streetLight', params: { lampOn: true } }), x, 0.15, -2.6, Math.PI));
place(KP.build({ prop: 'trashCan' }), -6, 0.15, -3);
place(KP.build({ prop: 'fireHydrant' }), 4, 0.15, -2.8);
place(KV.build({ prop: 'sedan' }), -9, 0, 0.6, Math.PI / 2);
const burner = place(KV.build({ prop: 'sedan', params: { condition: 'burned' } }), 6, 0, 2.5, -1.2);
place(KV.build({ prop: 'van' }), 16, 0, 0.6, Math.PI / 2);
place(KP.build({ prop: 'manhole' }), -2, 0, 4);
place(KP.build({ prop: 'jerseyBarrier', params: { count: 2 } }), 0, 0, 9, 0.2);
street.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
const lampLights = []; street.traverse(o => { if (o.isPointLight) lampLights.push(o); });
const lampMats = new Set(); for (const l of lamps) l.traverse(o => { if (o.isMesh && o.material.userData.role === 'lamp') lampMats.add(o.material); });

// ---------- particles & effect state ----------
const ps = new ParticleSystem(scene);
const flashes = [];
function flashLight(pos, color, intensity, dur) { const l = new THREE.PointLight(color, intensity, 25, 1.6); l.position.copy(pos); scene.add(l); flashes.push({ l, t: dur, dur, i: intensity }); }
const firePos = new THREE.Vector3(6, 0.9, 2.5), steamPos = new THREE.Vector3(-2, 0.05, 4), muzzlePos = new THREE.Vector3(-4, 1.4, 6);
const fireLight = new THREE.PointLight(0xff7a2a, 0, 14, 1.6); fireLight.position.copy(firePos).add(new THREE.Vector3(0, 0.8, 0)); scene.add(fireLight);
const cont = { rain: false, fire: true, steam: true };
const TRIGGERS = {
  'Muzzle flash': () => { const d = new THREE.Vector3(1, 0.05, -0.3).normalize(); EFFECTS.muzzle(ps, muzzlePos, d); flashLight(muzzlePos, 0xffc070, 30, 0.06); },
  'Sparks': () => EFFECTS.sparks(ps, new THREE.Vector3(-9, 0.9, 0.6), new THREE.Vector3(0, 0.6, 1).normalize()),
  'Concrete hit': () => EFFECTS.dust(ps, new THREE.Vector3(-3, 1.6, -5.9), new THREE.Vector3(0, 0, 1)),
  'Smoke grenade': () => EFFECTS.smoke(ps, new THREE.Vector3(2, 0.2, 7), 2),
  'Explosion': () => { const p = new THREE.Vector3(10, 0.6, 7); EFFECTS.explosion(ps, p); flashLight(p, 0xff9a40, 200, 0.5); },
  'Full burst': () => { let n = 0; const id = setInterval(() => { TRIGGERS['Muzzle flash'](); if (++n > 9) clearInterval(id); }, 90); },
};
for (const [name, f] of Object.entries(TRIGGERS)) { const b = document.createElement('button'); b.textContent = name; b.onclick = f; $('fxBtns').appendChild(b); }
for (const k of Object.keys(cont)) { const b = document.createElement('button'); b.textContent = { rain: 'Rain', fire: 'Car fire', steam: 'Steam vent' }[k]; b.classList.toggle('on', cont[k]); b.onclick = () => { cont[k] = !cont[k]; b.classList.toggle('on', cont[k]); }; $('fxToggles').appendChild(b); }

// click a surface -> bullet impact with material-appropriate effect
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(street, true).find(h => h.face); if (!hit) return;
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const m = Array.isArray(hit.object.material) ? hit.object.material[0] : hit.object.material;
  const metal = (m.metalness || 0) > 0.35;
  if (metal) { EFFECTS.sparks(ps, hit.point, n); flashLight(hit.point.clone().addScaledVector(n, 0.2), 0xffc070, 4, 0.05); }
  else EFFECTS.dust(ps, hit.point, n, 1, m.color ? m.color.getHex() : 0xb8b0a0);
});

// ---------- apply settings ----------
let autoNow = {};
function renderAutoReadout() { const el = document.getElementById('autoReadout'); if (el && autoNow.exposure !== undefined) el.textContent = L.autoAtmosphere ? `auto now: exposure ${autoNow.exposure.toFixed(2)} · bloom ${autoNow.bloomStrength.toFixed(2)} / thr ${autoNow.bloomThreshold.toFixed(2)} · fog ${autoNow.fogDensity.toFixed(4)}` : ''; }
function apply() {
  const st = look.apply(L);
  L.bloomTrim = look.settings.bloomTrim;
  autoNow = st;
  for (const l of lampLights) l.intensity = THREE.MathUtils.lerp(0, 28, Math.max(st.night, st.warm * 0.4));
  for (const m of lampMats) m.emissiveIntensity = THREE.MathUtils.lerp(0.2, 1.6, st.night);
  renderAutoReadout();
  ps.scale = L.particleScale;
}

// ---------- panel ----------
const labelOf = k => k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
function renderPanel() {
  const wrap = $('params'); wrap.innerHTML = '';
  for (const [group, rows] of SPEC) {
    const h = document.createElement('h2'); h.textContent = group; wrap.appendChild(h);
    if (group === 'Time & atmosphere') { const n = document.createElement('div'); n.id = 'autoReadout'; n.style.cssText = 'color:var(--dim);font:11px ui-monospace,monospace;margin:2px 0 4px'; wrap.appendChild(n); }
    for (const [k, a, b, step, unit, only] of rows) {
      if (only === 'auto' && !L.autoAtmosphere) continue;
      if (only === 'manual' && L.autoAtmosphere) continue;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<label title="${unit || ''}">${labelOf(k)}</label>`;
      if (a === 'bool') { const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!L[k]; cb.onchange = () => { L[k] = cb.checked; if (k === 'autoAtmosphere') renderPanel(); apply(); persist(); }; row.appendChild(cb); }
      else if (Array.isArray(a)) { const sel = document.createElement('select'); sel.style.gridColumn = '2 / span 2'; sel.innerHTML = a.map(o => `<option>${o}</option>`).join(''); sel.value = L[k]; sel.onchange = () => { L[k] = sel.value; apply(); persist(); }; row.appendChild(sel); }
      else {
        const inp = document.createElement('input'); Object.assign(inp, { type: 'range', min: a, max: b, step, value: L[k] });
        const val = document.createElement('span'); val.className = 'val'; val.textContent = L[k];
        inp.oninput = () => { L[k] = parseFloat(inp.value); val.textContent = L[k]; apply(); persist(); };
        row.append(inp, val);
      }
      wrap.appendChild(row);
    }
  }
  renderAutoReadout();
}
$('preset').innerHTML = '<option value="">Custom</option>' + Object.keys(PRESETS).map(k => `<option>${k}</option>`).join('');
$('preset').onchange = () => { const p = PRESETS[$('preset').value]; if (!p) return; L = { ...DEFAULT }; for (const [k, v] of Object.entries(p)) if (k in L) L[k] = v; cont.rain = !!p.rain; [...$('fxToggles').children][0].classList.toggle('on', cont.rain); renderPanel(); apply(); persist(); };
$('bReset').onclick = () => { L = { ...DEFAULT }; renderPanel(); apply(); persist(); };
$('bCopy').onclick = async () => { const t = JSON.stringify({ kind: 'lookSettings', version: 1, look: L }, null, 2); try { await navigator.clipboard.writeText(t); $('bCopy').textContent = 'Copied'; setTimeout(() => ($('bCopy').textContent = 'Copy settings'), 1200); } catch (e) { prompt('Copy:', t); } };
renderPanel(); apply();

// ---------- loop ----------
function resize() { const w = main.clientWidth, h = main.clientHeight; renderer.setSize(w, h, false); look.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(main); resize();
if (location.hash === '#autotest') window.__vfx = { TRIGGERS, ps, setPreset: n => { $('preset').value = n; $('preset').onchange(); }, cont };
const clock = new THREE.Clock(); let fpsT = 0, frames = 0, fps = 0, fireAcc = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  fireAcc += dt;
  while (fireAcc > 1 / 30) {
    fireAcc -= 1 / 30;
    if (cont.fire) EFFECTS.fireTick(ps, firePos);
    if (cont.steam) EFFECTS.steamTick(ps, steamPos);
    if (cont.rain) EFFECTS.rainTick(ps, orbit.target);
  }
  fireLight.intensity = cont.fire ? 25 + Math.random() * 15 : 0;
  for (let i = flashes.length - 1; i >= 0; i--) { const f = flashes[i]; f.t -= dt; f.l.intensity = f.i * Math.max(0, f.t / f.dur); if (f.t <= 0) { scene.remove(f.l); flashes.splice(i, 1); } }
  ps.update(dt);
  look.tick(dt);
  orbit.update();
  renderer.info.reset(); look.render();
  frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; $('stat').textContent = `${fps.toFixed(0)} fps · ${ps.count} particles · ${renderer.info.render.calls} draw calls`; }
});
</script>
</body>
</html>
