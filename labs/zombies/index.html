<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Lab</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0e0f10; color:#e6e6e6; font:13px/1.35 system-ui, sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:absolute; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px; }
  #bar button, #bar select { background:rgba(30,33,37,.92); color:#e6e6e6; border:1px solid #2e3238; border-radius:6px; padding:6px 9px; font:inherit; cursor:pointer; }
  #bar button.on { background:#f2c14e; color:#111; font-weight:600; }
  #bar .sep { width:1px; background:#2e3238; margin:0 4px; }
  #info { position:absolute; left:10px; bottom:10px; background:rgba(15,17,20,.85); border:1px solid #2e3238; border-radius:6px; padding:7px 9px; font:12px/1.5 ui-monospace, Menlo, monospace; white-space:pre; }
  a.back { position:absolute; right:12px; bottom:12px; color:#9aa0a6; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="info"></div>
<a class="back" href="../../">hub</a>
<script type="module" src="./main.js"></script>
</body>
</html>
