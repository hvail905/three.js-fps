<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Lab</title>
<style>
  :root { --panel:#1e2125; --line:#2e3238; --text:#e6e6e6; --dim:#9aa0a6; --acc:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#16181b; color:var(--text); font:13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display:flex; height:100%; }
  aside { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px 12px 24px; }
  main { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:0 0 8px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:12px 0 4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  button, select, input[type=color] { background:#2a2e34; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; cursor:pointer; }
  button.on { background:var(--acc); color:#111; font-weight:600; }
  .row { display:grid; grid-template-columns:96px 1fr 44px; gap:6px; align-items:center; margin:3px 0; }
  .row label { color:var(--dim); font-size:12px; }
  .row input[type=range] { width:100%; accent-color:var(--acc); } .row .val { font:12px ui-monospace, Menlo, monospace; text-align:right; }
  .row select, .row input[type=color] { grid-column:2 / span 2; width:100%; } .row input[type=color] { height:26px; padding:0; }
  .row input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }
  #toolbar { position:absolute; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  #toolbar > * { pointer-events:auto; background:rgba(30,33,37,.9); }
  #toolbar button.on { background:var(--acc); }
  #info { position:absolute; left:10px; bottom:10px; background:rgba(15,17,20,.85); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:12px/1.5 ui-monospace, Menlo, monospace; pointer-events:none; white-space:pre; }
  #toast { position:absolute; right:12px; bottom:12px; background:var(--acc); color:#111; padding:7px 11px; border-radius:6px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width: 760px) { #app { flex-direction:column-reverse; } aside { width:100%; height:45vh; border-right:none; } main { height:55vh; flex:none; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>Character lab</h1>
    <div class="grid" id="arch"></div>
    <h2>Legs</h2>
    <div class="grid" id="clips"></div>
    <h2>Upper body</h2>
    <div class="grid" id="uppers"></div>
    <div class="row"><label>Speed</label><input id="rate" type="range" min="0.1" max="2" step="0.05" value="1"><span class="val" id="rateV">1</span></div>
    <div id="params"></div>
    <div class="grid" style="margin-top:10px"><button id="bCopy">Copy preset</button><button id="bLib">Copy library code</button><button id="bReset">Reset</button><button id="bRandom">Randomize (believable)</button></div>
  </aside>
  <main>
    <div id="toolbar"><button id="tZones">Hit zones</button><button id="tJoints">Joints</button><button id="tLineup">Lineup</button><button id="tCrowd">Crowd (varied)</button><button id="tHeal">Revive all</button><button id="tAO" class="on">Ambient occlusion</button><button id="tRim" class="on">Rim light</button></div>
    <div id="info"></div><div id="toast"></div>
  </main>
</div>
<script type="module">
import { createCharacterLibrary } from '../../src/assets/characters.js';
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const $ = id => document.getElementById(id);
const LIB = createCharacterLibrary(THREE), IDS = Object.keys(LIB.props);
const st = { current: 'soldier', params: {}, legs: 'idle', upper: 'carry', zones: false, joints: false, lineup: false, crowd: false, ao: true, rim: true };
for (const id of IDS) st.params[id] = LIB.defaults(id);
try { const s = JSON.parse(localStorage.getItem('charlab.v1') || 'null'); if (s) { for (const id of IDS) Object.assign(st.params[id], s.params?.[id] || {}); if (IDS.includes(s.current)) st.current = s.current; } } catch (e) {}
const persist = () => { try { localStorage.setItem('charlab.v1', JSON.stringify({ current: st.current, params: st.params })); } catch (e) {} };

const main = document.querySelector('main');
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
main.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfcad3); scene.fog = new THREE.Fog(0xbfcad3, 25, 85);
const camera = new THREE.PerspectiveCamera(40, 1, 0.3, 90); camera.position.set(2.6, 1.7, 3.6);
const orbit = new OrbitControls(camera, renderer.domElement); orbit.target.set(0, 1, 0); orbit.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfd6ff, 1.6); rim.position.set(-4, 3, -5); scene.add(rim);
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 512, 512); gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.5, thickness: 1, scale: 1.2, samples: 16 }); gtao.blendIntensity = 0.9; composer.addPass(gtao);
composer.addPass(new OutputPass());
const floor = new THREE.Mesh(new THREE.CircleGeometry(120, 48), new THREE.MeshStandardMaterial({ color: 0x8a8f94, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, 0x5a5f66, 0x70757c); grid.position.y = 0.002; scene.add(grid);

// ---------- characters on stage ----------
const ZONE_COL = { head: 0xef4444, torso: 0xf59e0b, arm: 0x3b82f6, leg: 0x22c55e };
const zoneMats = Object.fromEntries(Object.entries(ZONE_COL).map(([k, c]) => [k, new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 })]));
let actors = [];
function makeActor(id, x) {
  const obj = LIB.build({ prop: id, params: st.params[id] });
  obj.position.x = x; scene.add(obj);
  const a = { id, obj, anim: { legs: st.legs, upper: st.upper, t: Math.random() * 3, rate: 1 }, hp: obj.userData.damage.health, dead: false, markers: null };
  obj.traverse(o => { if (o.isMesh) o.userData.orig = o.material; });
  applyZones(a); addJointMarkers(a);
  return a;
}
const crowdParams = [];
function rebuild() {
  for (const a of actors) { scene.remove(a.obj); LIB.dispose(a.obj); }
  if (st.crowd) {
    actors = [];
    const legsOpts = ['idle', 'walk', 'idle', 'walk', 'run', 'crouch'], upperOpts = ['carry', 'free', 'aim', 'carry'];
    for (let i = 0; i < 12; i++) {
      const p = crowdParams[i] || (crowdParams[i] = LIB.randomize(st.current, i * 7919 + 13));
      const saved = st.params[st.current]; st.params[st.current] = p;
      const a = makeActor(st.current, ((i % 4) - 1.5) * 1.3); a.obj.position.z = (Math.floor(i / 4) - 1) * -1.6;
      a.anim.legs = legsOpts[i % legsOpts.length]; a.anim.upper = upperOpts[(i * 3) % upperOpts.length]; a.anim.rate = 0.9 + ((i * 37) % 20) / 100;
      st.params[st.current] = saved; actors.push(a);
    }
  } else actors = st.lineup ? IDS.map((id, i) => makeActor(id, (i - (IDS.length - 1) / 2) * 1.3)) : [makeActor(st.current, 0)];
  info(); persist();
}
function applyZones(a) { a.obj.traverse(o => { if (o.isMesh) o.material = st.zones && o.userData.zone ? zoneMats[o.userData.zone] : o.userData.orig; }); }
function addJointMarkers(a) {
  if (!st.joints) return;
  const m = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
  for (const j of Object.values(a.obj.userData.rig.joints)) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), m); s.renderOrder = 10; j.add(s); }
}

// ---------- shooting the hit zones ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null, lastHit = '';
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(actors.map(a => a.obj), true).find(h => h.object.userData.zone);
  if (!hit) return;
  let o = hit.object; while (o.parent && !actors.some(a => a.obj === o)) o = o.parent;
  const a = actors.find(x => x.obj === o); if (!a || a.dead) return;
  const zone = hit.object.userData.zone, d = a.obj.userData.damage, dmg = 30 * d[zone];
  // bullet direction and hit side in the character's own frame
  const dir = ray.ray.direction.clone().applyQuaternion(a.obj.quaternion.clone().invert()); dir.y = 0; dir.normalize();
  const side = a.obj.worldToLocal(hit.point.clone()).x > 0 ? 1 : -1;
  const fromWhere = Math.abs(dir.z) >= Math.abs(dir.x) ? (dir.z < 0 ? 'front' : 'back') : (dir.x > 0 ? 'their right' : 'their left');
  a.hp -= dmg; lastHit = `${zone} hit from ${fromWhere}: 30 × ${d[zone]} = ${dmg.toFixed(0)} damage`;
  if (a.hp <= 0) { a.hp = 0; a.dead = true; LIB.kill(a.anim, zone, [dir.x, dir.z]); lastHit += ' · killed'; }
  else LIB.hit(a.anim, zone, [dir.x, dir.z], side, Math.min(1.4, 0.6 + dmg / 40));
  info();
});

// ---------- panel ----------
const labelOf = k => k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
function renderArch() {
  $('arch').innerHTML = '';
  for (const id of IDS) { const b = document.createElement('button'); b.textContent = LIB.props[id].label; b.className = id === st.current ? 'on' : ''; b.onclick = () => { st.current = id; renderArch(); renderParams(); rebuild(); }; $('arch').appendChild(b); }
  $('clips').innerHTML = ''; $('uppers').innerHTML = '';
  for (const c of LIB.LEGS) { const b = document.createElement('button'); b.textContent = c; b.className = c === st.legs ? 'on' : ''; b.onclick = () => { st.legs = c; for (const a of actors) if (!a.dead) LIB.setLegs(a.anim, c); renderArch(); }; $('clips').appendChild(b); }
  for (const c of LIB.UPPER) { const b = document.createElement('button'); b.textContent = c; b.className = c === st.upper ? 'on' : ''; b.onclick = () => { st.upper = c; for (const a of actors) if (!a.dead) LIB.setUpper(a.anim, c); renderArch(); }; $('uppers').appendChild(b); }
}
const GROUPS = { Body: ['height', 'build', 'headSize', 'skinColor', 'hair', 'hairColor'], Outfit: ['shirtColor', 'sleeves', 'pantsColor', 'shoeColor', 'jacket', 'jacketColor'], Gear: ['vest', 'helmet', 'backpack', 'vestColor', 'mask', 'gloves', 'carryWeapon'], 'Damage model': ['headMult', 'torsoMult', 'armMult', 'legMult', 'health'] };
function renderParams() {
  const wrap = $('params'); wrap.innerHTML = '';
  const p = st.params[st.current], specs = LIB.props[st.current].params;
  for (const [g, keys] of Object.entries(GROUPS)) {
    const h = document.createElement('h2'); h.textContent = g; wrap.appendChild(h);
    for (const k of keys) {
      const s = specs[k], row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<label>${labelOf(k)}</label>`;
      let inp;
      if (s.type === 'range') { inp = document.createElement('input'); Object.assign(inp, { type: 'range', min: s.min, max: s.max, step: s.step, value: p[k] }); const v = document.createElement('span'); v.className = 'val'; v.textContent = p[k]; inp.oninput = () => { p[k] = parseFloat(inp.value); v.textContent = p[k]; rebuild(); }; row.append(inp, v); }
      else if (s.type === 'color') { inp = document.createElement('input'); inp.type = 'color'; inp.value = p[k]; inp.oninput = () => { p[k] = inp.value; rebuild(); }; row.append(inp); }
      else if (s.type === 'bool') { inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = p[k]; inp.onchange = () => { p[k] = inp.checked; rebuild(); }; row.append(inp); }
      else { inp = document.createElement('select'); inp.innerHTML = s.options.map(o => `<option>${o}</option>`).join(''); inp.value = p[k]; inp.onchange = () => { p[k] = inp.value; rebuild(); }; row.append(inp); }
      wrap.appendChild(row);
    }
  }
}
function info() {
  const a = actors[0]; if (!a) return;
  const d = a.obj.userData.damage, L = a.obj.userData.rig.L;
  let tris = 0; a.obj.traverse(o => { if (o.isMesh) tris += o.geometry.index.count / 3; });
  $('info').textContent = `${LIB.props[a.id].label} · ${st.params[a.id].height.toFixed(2)} m · ${tris} tris · ${Object.keys(a.obj.userData.rig.joints).length} joints\n` +
    `HP ${Math.max(0, a.hp).toFixed(0)} / ${d.health} · multipliers: head ${d.head} · torso ${d.torso} · arm ${d.arm} · leg ${d.leg}\n` + (lastHit ? lastHit : 'Click a body part to shoot it (30 base damage).');
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1500); }
async function copy(text, label) { try { await navigator.clipboard.writeText(text); toast(label + ' copied'); } catch (e) { prompt('Copy:', text); } }
$('bCopy').onclick = () => copy(JSON.stringify({ kind: 'character', version: LIB.VERSION, prop: st.current, params: st.params[st.current] }, null, 2), 'Preset');
$('bLib').onclick = () => copy('// Character library: const lib = createCharacterLibrary(THREE); const c = lib.build(preset); const anim = { clip: "idle" };\n// each frame: lib.animate(c, anim, dt); switch clips with lib.play(anim, "run").\nexport ' + createCharacterLibrary.toString(), 'Library');
$('bReset').onclick = () => { st.params[st.current] = LIB.defaults(st.current); renderParams(); rebuild(); };
$('bRandom').onclick = () => { st.params[st.current] = LIB.randomize(st.current); renderParams(); rebuild(); };
$('bRandomOld') && ($('bRandomOld').onclick = () => {
  const p = st.params[st.current], hue = () => '#' + new THREE.Color().setHSL(Math.random(), 0.25 + Math.random() * 0.3, 0.2 + Math.random() * 0.4).getHexString();
  for (const [k, s] of Object.entries(LIB.props[st.current].params)) {
    if (/Mult|health/.test(k)) continue;
    if (s.type === 'range') p[k] = +(s.min + Math.random() * (s.max - s.min)).toFixed(2);
    else if (s.type === 'bool') p[k] = Math.random() < 0.5;
    else if (s.type === 'select') p[k] = s.options[Math.floor(Math.random() * s.options.length)];
    else if (k !== 'skinColor') p[k] = hue();
  }
  renderParams(); rebuild();
});
$('rate').oninput = () => { $('rateV').textContent = $('rate').value; };
const tog = (id, key, f) => { $(id).onclick = () => { st[key] = !st[key]; $(id).classList.toggle('on', st[key]); f(); }; };
tog('tZones', 'zones', () => actors.forEach(applyZones));
tog('tJoints', 'joints', rebuild);
tog('tLineup', 'lineup', () => { rebuild(); orbit.target.set(0, 1, 0); camera.position.set(st.lineup ? 4 : 2.6, st.lineup ? 2.4 : 1.7, st.lineup ? 9 : 3.6); });
$('tHeal').onclick = () => { for (const a of actors) { a.hp = a.obj.userData.damage.health; a.dead = false; LIB.revive(a.anim); } lastHit = ''; info(); };
tog('tCrowd', 'crowd', () => { crowdParams.length = 0; rebuild(); camera.position.set(st.crowd ? 4.5 : 2.6, st.crowd ? 2.8 : 1.7, st.crowd ? 8 : 3.6); });
$('tAO').onclick = () => { st.ao = !st.ao; $('tAO').classList.toggle('on', st.ao); };
$('tRim').onclick = () => { st.rim = !st.rim; $('tRim').classList.toggle('on', st.rim); rim.visible = st.rim; };

function resize() { const w = main.clientWidth, h = main.clientHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(main);
renderArch(); renderParams(); rebuild(); resize();
if (location.hash === '#autotest') window.__ch = { st, legs: c => { for (const a of actors) LIB.setLegs(a.anim, c); }, upper: c => { for (const a of actors) LIB.setUpper(a.anim, c); }, kill: (zone, dx, dz) => { for (const a of actors) LIB.kill(a.anim, zone, [dx, dz]); }, hit: (zone, dx, dz, side) => { for (const a of actors) LIB.hit(a.anim, zone, [dx, dz], side, 1.2); }, revive: () => { for (const a of actors) LIB.revive(a.anim); }, crowd: () => $('tCrowd').click(), lineup: () => $('tLineup').click(), zones: () => $('tZones').click() };
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), rate = parseFloat($('rate').value);
  for (const a of actors) {
    LIB.animate(a.obj, a.anim, dt * rate);
  }
  orbit.update(); if (st.ao) composer.render(); else renderer.render(scene, camera);
});
</script>
</body>
</html>
