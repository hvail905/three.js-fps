<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPS Movement Lab</title>
<style>
  :root { --panel:#1e2125; --line:#2e3238; --text:#e6e6e6; --dim:#9aa0a6; --acc:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--text); font:13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  canvas#view { display:block; width:100vw; height:100vh; }
  #crosshair { position:fixed; left:50%; top:50%; width:14px; height:14px; transform:translate(-50%,-50%); pointer-events:none; }
  #crosshair::before, #crosshair::after { content:""; position:absolute; background:#fff; mix-blend-mode:difference; }
  #crosshair::before { left:6px; top:0; width:2px; height:14px; }
  #crosshair::after { top:6px; left:0; height:2px; width:14px; }
  #hud { position:fixed; left:12px; top:12px; background:rgba(15,17,20,.78); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:12px/1.55 ui-monospace, Menlo, Consolas, monospace; pointer-events:none; min-width:250px; }
  #hud .big { font-size:22px; font-weight:700; color:var(--acc); }
  #hud .chips span { display:inline-block; padding:1px 6px; margin:2px 3px 2px 0; border-radius:4px; background:#2a2e34; color:#777; font-size:11px; }
  #hud .chips span.on { background:var(--acc); color:#111; font-weight:700; }
  #spark { display:block; margin-top:6px; width:250px; height:46px; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #overlay .card { pointer-events:auto; background:rgba(15,17,20,.9); border:1px solid var(--line); border-radius:10px; padding:18px 22px; text-align:center; cursor:pointer; max-width:420px; }
  #overlay h1 { margin:0 0 10px; font-size:18px; letter-spacing:.14em; color:var(--acc); }
  #overlay p { margin:4px 0; color:var(--dim); }
  #overlay .keys { color:var(--text); }
  #overlay.hidden { display:none; }
  #panel { position:fixed; right:0; top:0; bottom:0; width:330px; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:12px 12px 30px; }
  #panel.hidden { display:none; }
  #panel h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); margin:0 0 8px; }
  #panel h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 0 4px; }
  .row { display:grid; grid-template-columns:118px 1fr 48px; align-items:center; gap:6px; margin:4px 0; }
  .row label { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row input[type=range] { width:100%; accent-color:var(--acc); }
  .row .val { font:12px ui-monospace, Menlo, monospace; text-align:right; }
  .row input[type=checkbox] { accent-color:var(--acc); width:16px; height:16px; }
  select, button { background:#2a2e34; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; cursor:pointer; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .top { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:9; }
  #modal.show { display:flex; }
  #modal .box { width:min(560px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  #modal textarea { width:100%; height:260px; background:#111317; color:var(--text); border:1px solid var(--line); border-radius:6px; font:12px ui-monospace, Menlo, monospace; padding:8px; }
  #modal .actions { display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--acc); color:#111; padding:7px 12px; border-radius:6px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="crosshair"></div>
<div id="hud">
  <div><span class="big" id="hSpeed">0.0</span> m/s <span id="hKmh" style="color:var(--dim)"></span></div>
  <div class="chips" id="hChips"></div>
  <div id="hJump">last jump: --</div>
  <div id="hSprint">50 m: --</div>
  <div id="hPos" style="color:var(--dim)"></div>
  <canvas id="spark" width="500" height="92"></canvas>
</div>
<div id="overlay"><div class="card" id="playCard">
  <h1>MOVEMENT LAB</h1>
  <p class="keys">Click to play</p>
  <p>WASD move · mouse look · Shift sprint · Space jump</p>
  <p>C crouch (crouch while sprinting to slide) · R respawn · Esc pause and tune</p>
  <p style="margin-top:10px;font-size:12px">Needs a keyboard and mouse.</p>
</div></div>
<div id="panel">
  <h1>Movement tuning</h1>
  <div class="top">
    <select id="preset"><option value="standard">Preset: Standard (yours)</option><option value="classic">Preset: Classic</option><option value="tactical">Preset: Tactical</option><option value="arcade">Preset: Arcade</option></select>
    <select id="weapon"></select>
  </div>
  <div id="params"></div>
  <div class="btns">
    <button id="bCopy">Copy settings</button>
    <button id="bLoad">Load settings</button>
    <button id="bReset">Reset to preset</button>
    <button id="bSpawn">Respawn</button>
  </div>
</div>
<div id="modal"><div class="box">
  <p id="mMsg" style="margin:0 0 8px;color:var(--dim)"></p>
  <textarea id="mText" spellcheck="false"></textarea>
  <div class="actions"><button id="mApply">Apply</button><button id="mClose">Close</button></div>
</div></div>
<div id="toast"></div>

<script type="module">
import { createWeaponLibrary } from '../../src/assets/weapons.js';
import * as THREE from 'three';
import { MeshBVH } from 'three-mesh-bvh';
import { TICK, DEFAULT_PARAMS, makeCommand, makePlayer, stepPlayer } from '../../src/sim/movement.js';
import { buildCourse } from './course.js';
import { createCameraFeel, VIEW_DEFAULTS } from '../../src/render/camera-feel.js';

const $ = id => document.getElementById(id);

// ---------- parameters ----------
// P = simulation (gameplay) parameters. V = presentation-only parameters.
const PRESETS = {
  standard: {},
  classic: { sprintSpeed: 7.0, crouchSpeed: 2.2, groundAccel: 12, airAccel: 2.0, friction: 7, gravity: 20, jumpHeight: 1.1, slideBoost: 1.25, slideMaxSpeed: 10, slideFriction: 1.2, sprintFov: 8, bobAmount: 0.035, bobRate: 0.9, weaponSway: 1.0 },
  tactical: { walkSpeed: 3.6, sprintSpeed: 6.0, crouchSpeed: 1.8, groundAccel: 8, airAccel: 0.8, friction: 8, jumpHeight: 0.9, slideBoost: 1.1, bobAmount: 0.045, sprintFov: 5 },
  arcade: { walkSpeed: 6.5, sprintSpeed: 10, crouchSpeed: 3.2, groundAccel: 20, airAccel: 6, friction: 5, gravity: 22, jumpHeight: 1.4, slideBoost: 1.4, slideMaxSpeed: 14, slideFriction: 0.8, sprintFov: 12, bobAmount: 0.025 },
};
const SPEC = [
  ['Speed', [['walkSpeed', 1, 10, 0.1, 'm/s'], ['sprintSpeed', 2, 14, 0.1, 'm/s'], ['crouchSpeed', 0.5, 5, 0.1, 'm/s']]],
  ['Acceleration', [['groundAccel', 1, 40, 0.5], ['airAccel', 0, 20, 0.1, 'air control'], ['friction', 0, 15, 0.1], ['stopSpeed', 0, 5, 0.1]]],
  ['Jump & gravity', [['jumpHeight', 0.3, 2.5, 0.05, 'm'], ['gravity', 5, 40, 0.5, 'm/s²'], ['coyoteTime', 0, 0.3, 0.01, 's'], ['jumpBuffer', 0, 0.3, 0.01, 's']]],
  ['Terrain', [['maxSlope', 10, 70, 1, '°'], ['stepHeight', 0, 0.35, 0.01, 'm (≤ radius)']]],
  ['Body & crouch', [['standHeight', 1.5, 2.1, 0.01, 'm'], ['crouchHeight', 0.8, 1.5, 0.01, 'm'], ['crouchTime', 0.02, 0.5, 0.01, 's'], ['crouchToggle', 'bool', 'view']]],
  ['Slide', [['slide', 'bool'], ['slideMinSpeed', 2, 12, 0.1, 'm/s'], ['slideBoost', 1, 2, 0.01, '×'], ['slideMaxSpeed', 4, 18, 0.1, 'm/s'], ['slideFriction', 0, 6, 0.05], ['slideSteer', 0, 10, 0.1]]],
  ['Camera feel', [['fov', 60, 110, 1, '°', 'view'], ['sprintFov', 0, 20, 0.5, '°', 'view'], ['slideFov', 0, 20, 0.5, '°', 'view'], ['bobAmount', 0, 0.1, 0.001, 'm', 'view'], ['bobRate', 0.3, 2, 0.01, 'steps/m', 'view'], ['strafeTilt', 0, 5, 0.1, '°', 'view'], ['landDip', 0, 3, 0.05, '×', 'view'], ['weaponSway', 0, 3, 0.05, '×', 'view']]],
  ['Mouse', [['sensitivity', 0.3, 6, 0.05, '', 'view'], ['invertY', 'bool', 'view']]],
];
let P = { ...DEFAULT_PARAMS }, V = { ...VIEW_DEFAULTS }, presetName = 'standard', weaponId = 'rifle';
function applyPreset(name) {
  presetName = name;
  P = { ...DEFAULT_PARAMS }; V = { ...VIEW_DEFAULTS };
  for (const [k, v] of Object.entries(PRESETS[name] || {})) { if (k in P) P[k] = v; else V[k] = v; }
}
applyPreset('standard');
try {
  const saved = JSON.parse(localStorage.getItem('movelab.v2') || 'null');
  if (saved) { presetName = saved.preset || 'standard'; Object.assign(P, saved.sim || {}); Object.assign(V, saved.view || {}); weaponId = saved.weapon ?? weaponId; }
} catch (e) {}
function persist() { try { localStorage.setItem('movelab.v2', JSON.stringify({ preset: presetName, weapon: weaponId, sim: P, view: V })); } catch (e) {} }

// ---------- renderer & world ----------
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd8df);
scene.fog = new THREE.Fog(0xcfd8df, 60, 160);
const camera = new THREE.PerspectiveCamera(V.fov, 1, 0.05, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
scene.add(sun, sun.target);

const course = buildCourse({ visual: true });
scene.add(course.group);
course.collider.boundsTree = new MeshBVH(course.collider);
const bvh = course.collider.boundsTree;

// ---------- player & fixed-step simulation ----------
const look = { yaw: 0, pitch: 0 };
let player = makePlayer(course.spawn);
const prev = { pos: player.pos.clone(), height: player.height };
const cmd = makeCommand();
let accumulator = 0;
function respawn() { player = makePlayer(course.spawn); player.height = P.standHeight; prev.pos.copy(player.pos); prev.height = player.height; look.yaw = 0; look.pitch = 0; }
respawn();

// ---------- input -> commands ----------
const keys = {};
let locked = false, jumpLatch = false, crouchToggled = false;
$('playCard').onclick = () => { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  $('overlay').classList.toggle('hidden', locked);
  $('panel').classList.toggle('hidden', locked);
  if (!locked) for (const k in keys) keys[k] = false;
});
document.addEventListener('mousemove', e => {
  if (!locked) return;
  const s = V.sensitivity * 0.001;
  look.yaw -= e.movementX * s;
  look.pitch = Math.max(-1.55, Math.min(1.55, look.pitch - e.movementY * s * (V.invertY ? -1 : 1)));
  swayIn.x += e.movementX; swayIn.y += e.movementY;
});
addEventListener('keydown', e => {
  if (!locked) return;
  if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyC'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) {
    if (e.code === 'Space') jumpLatch = true;
    if (e.code === 'KeyC' && V.crouchToggle) crouchToggled = !crouchToggled;
    if (e.code === 'KeyR') respawn();
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });

function sampleCommand() {
  cmd.moveZ = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  cmd.moveX = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  cmd.sprint = !!(keys.ShiftLeft || keys.ShiftRight);
  cmd.jump = !!keys.Space || jumpLatch;
  cmd.crouch = V.crouchToggle ? crouchToggled : !!keys.KeyC;
  cmd.yaw = look.yaw; cmd.pitch = look.pitch;
  return cmd;
}

// ---------- 50 m sprint timer & speed history ----------
const timer = { running: false, t0: 0, last: null, best: null };
const lane = course.lane;
const history = [];
let simTime = 0;
function telemetryAfterTick(before) {
  const p = player.pos, inLane = p.x > lane.x0 && p.x < lane.x1;
  if (inLane && before.z > lane.zStart && p.z <= lane.zStart) { timer.running = true; timer.t0 = simTime; }
  if (timer.running && (!inLane || p.z > lane.zStart + 0.5)) timer.running = false;
  if (timer.running && before.z > lane.zEnd && p.z <= lane.zEnd) {
    timer.running = false; timer.last = simTime - timer.t0;
    if (timer.best === null || timer.last < timer.best) timer.best = timer.last;
  }
  history.push(Math.hypot(player.vel.x, player.vel.z));
  if (history.length > 360) history.shift();
}

// ---------- weapon viewmodel (overlay scene) ----------
const WLIB = createWeaponLibrary(THREE);
const weaponScene = new THREE.Scene();
const weaponCam = new THREE.PerspectiveCamera(55, 1, 0.05, 10);
weaponScene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const wl1 = new THREE.DirectionalLight(0xffffff, 1.8); wl1.position.set(1, 2, 1.5); weaponScene.add(wl1);
const wl2 = new THREE.DirectionalLight(0xffffff, 1.1); wl2.position.set(-1, 0.6, 2); weaponScene.add(wl2);
const vmRoot = new THREE.Group(); weaponScene.add(vmRoot);
const skinMat = new THREE.MeshStandardMaterial({ color: 0xc69c7a, roughness: 0.8, flatShading: true });
const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x3a4436, roughness: 0.95, flatShading: true });
let weapon = null;
function addArm(parent, [x, y, z], side) {
  const hand = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.06, 0.08), skinMat); hand.position.set(x + side * 0.004, y - 0.01, z + 0.01); parent.add(hand);
  const from = new THREE.Vector3(x, y - 0.02, z + 0.05), to = from.clone().add(new THREE.Vector3(side * 0.06, -0.2, 0.42));
  const dir = to.clone().sub(from), len = dir.length();
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.038, len, 8), sleeveMat);
  arm.position.copy(from).add(to).multiplyScalar(0.5); arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  parent.add(arm);
}
function setWeapon(id) {
  weaponId = id;
  if (weapon) { vmRoot.remove(weapon); WLIB.dispose(weapon); weapon = null; }
  if (!id) return;
  weapon = WLIB.build({ prop: id });
  addArm(weapon, weapon.userData.anchors.grip, 1);
  if (weapon.userData.anchors.support) addArm(weapon, weapon.userData.anchors.support, -1);
  vmRoot.add(weapon);
}
const wsel = $('weapon');
wsel.innerHTML = '<option value="">Weapon: none</option>' + Object.entries(WLIB.props).map(([id, d]) => `<option value="${id}">Weapon: ${d.label}</option>`).join('');
wsel.value = weaponId; setWeapon(weaponId);
wsel.onchange = () => { setWeapon(wsel.value); persist(); };

// ---------- presentation state (render-only) ----------
// camera feel is shared with the game: src/render/camera-feel.js
const feel = createCameraFeel(), fx = feel.fx;
const swayIn = { x: 0, y: 0 }, sway = { x: 0, y: 0 };
const camPos = new THREE.Vector3();
const D2R = THREE.MathUtils.degToRad, lerp = THREE.MathUtils.lerp;

function present(dt, alpha) {
  camPos.lerpVectors(prev.pos, player.pos, alpha);
  const height = lerp(prev.height, player.height, alpha);
  feel.update(camera, dt, { pos: camPos, height, player, yaw: look.yaw, pitch: look.pitch, V, P });
  const bobX = fx.bobX, bobY = fx.bobY;

  // weapon: hip pose + bob + mouse sway + sprint pose + landing dip
  if (weapon) {
    const vm = weapon.userData.viewmodel, h = vm.hip.position, r = vm.hip.rotationDeg;
    sway.x = lerp(sway.x, Math.max(-40, Math.min(40, swayIn.x)), Math.min(1, dt * 10));
    sway.y = lerp(sway.y, Math.max(-40, Math.min(40, swayIn.y)), Math.min(1, dt * 10));
    swayIn.x = 0; swayIn.y = 0;
    const s = V.weaponSway, sb = fx.sprintBlend;
    vmRoot.position.set(
      h[0] + bobX * 0.6 * s - sway.x * 0.0004 * s - sb * 0.04,
      h[1] - bobY * 0.6 * s + sway.y * 0.0004 * s - sb * 0.04 + fx.dip * 0.06,
      h[2] + sb * 0.03,
    );
    vmRoot.rotation.set(D2R(r[0]) - sb * 0.25 + sway.y * 0.0012 * s, D2R(r[1]) + sb * 0.55 + sway.x * 0.0012 * s, D2R(r[2]) + sb * 0.2 + fx.roll * 1.5, 'XYZ');
  }

  // shadows follow the player
  sun.target.position.set(camPos.x, 0, camPos.z);
  sun.position.set(camPos.x + 15, 35, camPos.z + 10);
}

// ---------- HUD ----------
const spark = $('spark').getContext('2d');
function hud() {
  const hs = Math.hypot(player.vel.x, player.vel.z);
  $('hSpeed').textContent = hs.toFixed(1);
  $('hKmh').textContent = `(${(hs * 3.6).toFixed(0)} km/h)`;
  const chip = (n, on) => `<span class="${on ? 'on' : ''}">${n}</span>`;
  $('hChips').innerHTML = chip('GROUND', player.onGround) + chip('AIR', !player.onGround) + chip('SPRINT', player.sprinting) + chip('CROUCH', player.crouched && !player.sliding) + chip('SLIDE', player.sliding);
  const j = player.lastJump;
  $('hJump').textContent = j ? `last jump: ${j.height.toFixed(2)} m up · ${j.distance.toFixed(2)} m across · ${j.airTime.toFixed(2)} s` : 'last jump: --';
  $('hSprint').textContent = `50 m: ${timer.running ? (simTime - timer.t0).toFixed(2) + ' s…' : timer.last ? timer.last.toFixed(2) + ' s' : '--'}${timer.best ? ` (best ${timer.best.toFixed(2)})` : ''}`;
  $('hPos').textContent = `pos ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(1)} · eye ${(fx.eye).toFixed(2)} m`;
  const W = 500, H = 92, max = Math.max(P.sprintSpeed, P.slideMaxSpeed, 1) * 1.1;
  spark.clearRect(0, 0, W, H);
  spark.strokeStyle = '#3a3f46'; spark.lineWidth = 1;
  for (const v of [P.walkSpeed, P.sprintSpeed]) { const y = H - (v / max) * H; spark.beginPath(); spark.moveTo(0, y); spark.lineTo(W, y); spark.stroke(); }
  spark.strokeStyle = '#f2c14e'; spark.lineWidth = 2; spark.beginPath();
  history.forEach((v, i) => { const x = (i / 359) * W, y = H - (v / max) * H; i ? spark.lineTo(x, y) : spark.moveTo(x, y); });
  spark.stroke();
}

// ---------- tuning panel ----------
const labelOf = k => k.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
function renderPanel() {
  $('preset').value = presetName;
  const wrap = $('params'); wrap.innerHTML = '';
  for (const [group, rows] of SPEC) {
    const h = document.createElement('h2'); h.textContent = group; wrap.appendChild(h);
    for (const spec of rows) {
      const [key, a, b, step, unit] = spec, isView = spec.includes('view'), obj = isView ? V : P;
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('label'); lab.textContent = labelOf(key); lab.title = (unit || '') + (isView ? ' (camera only)' : ''); row.appendChild(lab);
      if (a === 'bool') {
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!obj[key];
        cb.onchange = () => { obj[key] = cb.checked; persist(); };
        row.appendChild(cb);
      } else {
        const inp = document.createElement('input'); Object.assign(inp, { type: 'range', min: a, max: b, step, value: obj[key] });
        const val = document.createElement('span'); val.className = 'val';
        const fmt = v => (step >= 1 ? String(v) : Number(v).toFixed(step < 0.01 ? 3 : 2));
        val.textContent = fmt(obj[key]);
        inp.oninput = () => { obj[key] = parseFloat(inp.value); val.textContent = fmt(obj[key]); persist(); };
        row.append(inp, val);
      }
      wrap.appendChild(row);
    }
  }
}
renderPanel();
$('preset').onchange = () => { applyPreset($('preset').value); renderPanel(); persist(); };
$('bReset').onclick = () => { applyPreset(presetName); renderPanel(); persist(); toast('Reset to ' + presetName); };
$('bSpawn').onclick = respawn;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1500); }
let modalApply = null;
function modal(msg, text, apply) { $('mMsg').textContent = msg; $('mText').value = text; modalApply = apply; $('mApply').style.display = apply ? '' : 'none'; $('modal').classList.add('show'); if (!apply) $('mText').select(); }
$('mClose').onclick = () => $('modal').classList.remove('show');
$('mApply').onclick = () => { if (modalApply && modalApply($('mText').value) !== false) $('modal').classList.remove('show'); };
$('bCopy').onclick = async () => {
  const text = JSON.stringify({ kind: 'movement', version: 1, preset: presetName, sim: P, view: V }, null, 2);
  try { await navigator.clipboard.writeText(text); toast('Settings copied'); } catch (e) { modal('Clipboard blocked here. Copy manually:', text, null); }
};
$('bLoad').onclick = () => modal('Paste movement settings JSON:', '', text => {
  try {
    const d = JSON.parse(text);
    for (const [k, v] of Object.entries(d.sim || {})) if (k in DEFAULT_PARAMS && typeof v === typeof DEFAULT_PARAMS[k]) P[k] = v;
    for (const [k, v] of Object.entries(d.view || {})) if (k in VIEW_DEFAULTS && typeof v === typeof VIEW_DEFAULTS[k]) V[k] = v;
    renderPanel(); persist(); toast('Settings loaded');
  } catch (e) { $('mMsg').textContent = 'Could not load: ' + e.message; return false; }
});

// headless test hook: #autotest skips pointer lock and exposes state
if (location.hash === '#autotest') { locked = true; $('overlay').classList.add('hidden'); $('panel').classList.add('hidden'); window.__lab = { keys, look, get player() { return player; }, respawn, P, V, camera, scene }; }

// ---------- main loop ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = weaponCam.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix(); weaponCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let hudT = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  accumulator += dt;
  let steps = 0;
  while (accumulator >= TICK && steps < 8) {
    prev.pos.copy(player.pos); prev.height = player.height;
    const before = player.pos.clone();
    stepPlayer(player, sampleCommand(), P, bvh, TICK);
    jumpLatch = false;
    simTime += TICK;
    telemetryAfterTick(before);
    if (player.pos.y < -30) respawn();
    accumulator -= TICK; steps++;
  }
  if (steps === 8) accumulator = 0;
  present(dt, accumulator / TICK);
  hudT += dt; if (hudT > 0.05) { hud(); hudT = 0; }
  renderer.clear();
  renderer.render(scene, camera);
  if (weapon) { renderer.clearDepth(); renderer.render(weaponScene, weaponCam); }
});
</script>
